<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order flow</title>
  <desc id="desc">Browser UI connects through Express routes to library modules and JSON storage. The numbered strip traces order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#526176}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.panelhead{font-size:16px;font-weight:700}
      .body{font-size:13px}.small{font-size:12px;fill:#475569}.tiny{font-size:12px;fill:#526176}
      .node{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.highlight{fill:#fff1f2;stroke:#e11d48;stroke-width:2}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .flowline{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .num{fill:#2563eb}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
      .stephead{font-size:13px;font-weight:700;fill:#1d4ed8}.stepbody{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="30" y="38" class="title">ShopLedger · application architecture</text>
  <text x="30" y="61" class="subtitle">Node / Express POS, Khata credit ledger and GST invoicing · numbered path shows POST /api/orders</text>

  <!-- Primary architecture panels -->
  <rect x="25" y="85" width="220" height="345" rx="12" class="panel"/>
  <text x="43" y="115" class="panelhead">Browser UI · public/</text>
  <rect x="42" y="132" width="186" height="42" rx="7" class="node"/>
  <text x="54" y="158" class="body">index.html</text>
  <rect x="42" y="184" width="186" height="42" rx="7" class="node"/>
  <text x="54" y="210" class="body">js/app.js</text>
  <rect x="42" y="236" width="186" height="42" rx="7" class="node"/>
  <text x="54" y="262" class="body">css/style.css</text>
  <text x="43" y="307" class="small">Catalog, cart preview,</text>
  <text x="43" y="325" class="small">order register, Khata,</text>
  <text x="43" y="343" class="small">inventory and GST audit</text>
  <circle cx="57" cy="387" r="13" class="num"/><text x="57" y="391" class="numtext">1</text>
  <text x="78" y="391" class="small">POST order request</text>

  <rect x="275" y="85" width="205" height="345" rx="12" class="panel"/>
  <text x="293" y="115" class="panelhead">Express app</text>
  <rect x="292" y="132" width="171" height="70" rx="7" class="node"/>
  <text x="305" y="157" class="body" font-weight="700">server.js</text>
  <text x="305" y="178" class="small">JSON parser · static public/</text>
  <text x="305" y="194" class="small">mounts routers at /api</text>
  <rect x="292" y="216" width="171" height="79" rx="7" class="node"/>
  <text x="305" y="241" class="body">GET /orders/:id/invoice</text>
  <text x="305" y="262" class="small">orders.get(db, id)</text>
  <text x="305" y="280" class="small">→ invoice.render(order)</text>
  <text x="293" y="333" class="small">Routes handle API work;</text>
  <text x="293" y="351" class="small">server.js serves invoice HTML.</text>
  <circle cx="307" cy="390" r="13" class="num"/><text x="307" y="394" class="numtext">2</text>
  <text x="328" y="394" class="small">dispatch to /api router</text>

  <rect x="510" y="85" width="310" height="485" rx="12" class="panel"/>
  <text x="528" y="115" class="panelhead">Routers · routes/</text>
  <rect x="528" y="132" width="274" height="125" rx="7" class="node"/>
  <text x="542" y="157" class="body" font-weight="700">orders.js</text>
  <text x="542" y="180" class="small">GET /orders · GET /orders/:id</text>
  <text x="542" y="199" class="small">POST /orders · POST /orders/:id/cancel</text>
  <circle cx="556" cy="232" r="13" class="num"/><text x="556" y="236" class="numtext">3</text>
  <text x="578" y="236" class="small">validate cart, compute, save</text>
  <rect x="528" y="270" width="274" height="76" rx="7" class="node"/>
  <text x="542" y="295" class="body" font-weight="700">products.js</text>
  <text x="542" y="318" class="small">GET /products · GET /coupons</text>
  <rect x="528" y="358" width="274" height="76" rx="7" class="node"/>
  <text x="542" y="383" class="body" font-weight="700">customers.js</text>
  <text x="542" y="406" class="small">GET /customers · POST /:id/settle</text>
  <rect x="528" y="446" width="274" height="103" rx="7" class="node"/>
  <text x="542" y="471" class="body" font-weight="700">reports.js</text>
  <text x="542" y="494" class="small">dashboard · GST reconciliation</text>
  <text x="542" y="513" class="small">pricing preview · keyed export</text>
  <text x="542" y="535" class="tiny">All four routers mounted by server.js</text>

  <rect x="850" y="85" width="325" height="485" rx="12" class="panel"/>
  <text x="868" y="115" class="panelhead">Business modules · lib/</text>
  <rect x="868" y="132" width="139" height="58" rx="7" class="node"/>
  <text x="880" y="155" class="body">pricing.js</text><text x="880" y="174" class="tiny">subtotal · totals</text>
  <rect x="1017" y="132" width="140" height="58" rx="7" class="node"/>
  <text x="1029" y="155" class="body">coupons.js</text><text x="1029" y="174" class="tiny">validate · discount</text>
  <rect x="868" y="200" width="139" height="58" rx="7" class="node"/>
  <text x="880" y="223" class="body">tax.js</text><text x="880" y="242" class="tiny">HSN slabs · CGST/SGST</text>
  <rect x="1017" y="200" width="140" height="58" rx="7" class="node"/>
  <text x="1029" y="223" class="body">inventory.js</text><text x="1029" y="242" class="tiny">stock check/reserve</text>
  <rect x="868" y="268" width="139" height="58" rx="7" class="node"/>
  <text x="880" y="291" class="body">orders.js</text><text x="880" y="310" class="tiny">add · list · cancel</text>
  <rect x="1017" y="268" width="140" height="58" rx="7" class="node"/>
  <text x="1029" y="291" class="body">ledger.js</text><text x="1029" y="310" class="tiny">Khata · settlements</text>
  <rect x="868" y="336" width="139" height="58" rx="7" class="node"/>
  <text x="880" y="359" class="body">store.js</text><text x="880" y="378" class="tiny">read/write · audit</text>
  <rect x="1017" y="336" width="140" height="58" rx="7" class="node"/>
  <text x="1029" y="359" class="body">dates.js</text><text x="1029" y="378" class="tiny">date helpers</text>
  <rect x="868" y="404" width="139" height="58" rx="7" class="node"/>
  <text x="880" y="427" class="body">reports.js</text><text x="880" y="446" class="tiny">dashboard · recon</text>
  <rect x="1017" y="404" width="140" height="58" rx="7" class="highlight"/>
  <text x="1029" y="427" class="body" font-weight="700" fill="#9f1239">invoice.js</text><text x="1029" y="446" class="tiny">compute · render HTML</text>
  <rect x="868" y="478" width="289" height="70" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <rect x="881" y="491" width="15" height="15" rx="3" class="highlight"/>
  <text x="905" y="504" class="small">Ticket focus: invoice figures/rendering</text>
  <text x="881" y="529" class="tiny">pricing.js uses tax.js to resolve checkout GST rates</text>

  <!-- Cross-layer connections -->
  <path d="M245 212 H275" class="flowline"/>
  <path d="M480 244 H510" class="flowline"/>
  <path d="M820 213 H850" class="flowline"/>
  <text x="247" y="198" class="tiny">HTTP</text>
  <text x="482" y="230" class="tiny">API</text>
  <text x="821" y="199" class="tiny">calls</text>

  <rect x="25" y="470" width="220" height="115" rx="12" class="panel"/>
  <text x="43" y="498" class="panelhead">config.js</text>
  <text x="43" y="522" class="small">shop identity · port</text>
  <text x="43" y="542" class="small">HSN GST slabs · coupon rules</text>
  <text x="43" y="562" class="small">inventory defaults · admin key</text>
  <path d="M245 530 H255 V590 H840 V230 H868" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <rect x="510" y="600" width="310" height="86" rx="12" class="panel"/>
  <text x="530" y="630" class="panelhead">data/db.json</text>
  <text x="530" y="653" class="small">products · orders · customers · settlements · auditLog</text>
  <text x="530" y="674" class="tiny">JSON file is read/written by lib/store.js</text>
  <path d="M868 365 H835 V583 H820 V630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="838" y="579" class="tiny">read / write</text>

  <!-- Numbered order placement trace -->
  <rect x="25" y="710" width="1150" height="68" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="43" y="737" class="stephead">ORDER FLOW</text>
  <text x="43" y="758" class="stepbody">POST /api/orders</text>
  <circle cx="205" cy="738" r="13" class="num"/><text x="205" y="742" class="numtext">1</text>
  <text x="226" y="734" class="stephead">UI submits cart</text><text x="226" y="754" class="stepbody">public/js/app.js</text>
  <path d="M340 743 H380" class="flowline"/>
  <circle cx="400" cy="738" r="13" class="num"/><text x="400" y="742" class="numtext">2</text>
  <text x="421" y="734" class="stephead">Route resolves items</text><text x="421" y="754" class="stepbody">stock + coupon checks</text>
  <path d="M555 743 H595" class="flowline"/>
  <circle cx="615" cy="738" r="13" class="num"/><text x="615" y="742" class="numtext">3</text>
  <text x="636" y="734" class="stephead">Compute + apply</text><text x="636" y="754" class="stepbody">pricing · tax · Khata</text>
  <path d="M775 743 H815" class="flowline"/>
  <circle cx="835" cy="738" r="13" class="num"/><text x="835" y="742" class="numtext">4</text>
  <text x="856" y="734" class="stephead">Persist order</text><text x="856" y="754" class="stepbody">orders.add → audit → store.write</text>
  <path d="M1055 743 H1090" class="flowline"/>
  <text x="1099" y="734" class="stephead">201</text><text x="1099" y="754" class="stepbody">JSON</text>
</svg>
